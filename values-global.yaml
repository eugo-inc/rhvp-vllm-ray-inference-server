global:
  pattern: vllm-ray-inference-server
  singleArgoCD: true
  secretLoader:
    disabled: false
  options:
    installPlanApproval: Automatic
    syncPolicy: Automatic
    useCSV: false

  # GPU machine. One of:
  #   create - on AWS, the install adds one GPU worker: a g6.2xlarge with one
  #            NVIDIA L4 GPU (overrides/values-gpu-machineset-create-AWS.yaml).
  #            AWS bills that instance by the hour for as long as it runs.
  #   none   - the install adds no machine; bring your own GPU worker node.
  # On platforms other than AWS no machine is added, whatever this says.
  # AWS clusters installed into existing subnets: use "none" and add the GPU
  # MachineSet yourself; the job cannot copy a subnet given by ID and fails.
  # Change it in your fork BEFORE you install. Switching to "none" later stops
  # the job but does not delete a machine that was already created.
  gpuMachineSet: create

  # The model the server loads from Hugging Face.
  model:
    # Name clients put in the "model" field of OpenAI-style requests.
    id: qwen2.5-0.5b-instruct
    # Hugging Face repository the weights are downloaded from.
    source: Qwen/Qwen2.5-0.5B-Instruct
    # Hugging Face commit of that repository; empty means its newest commit.
    revision: 7ae557604adf67be50417f59c2c2f167def9a775

  # Scale-out across server pods. One of:
  #   none     - one server pod (the default). Inside that pod, Ray Serve can
  #              still add replicas (server.autoscaling in
  #              charts/all/ray-serve-llm/values.yaml).
  #   keda     - OpenShift's Custom Metrics Autoscaler adds and removes whole
  #              server pods on vLLM's waiting-request count (settings:
  #              scaleOut in charts/all/ray-serve-llm/values.yaml).
  #   kuberay  - KubeRay adds Ray worker pods. Designed, not built yet: the
  #              values check and the server chart refuse it.
  scaleOut:
    mode: none

  # Compare two inference-server images on this model, on the same GPU, with
  # the same requests (README, "Compare two images"). Off by default.
  #
  # A run takes the pattern's own server down for its whole length: plan it as
  # a maintenance window. The runner scales the server to 0 before the first
  # round (the comparison needs its GPU and its model volume) and back to 1
  # when the run ends, whether it finished, failed or was stopped. With the
  # defaults below a run is 22 rounds; we estimate 2 to 3 hours on one GPU, but
  # have not timed it on a cluster.
  #
  # When on:
  #   - a Job in vllm-notebook runs the rounds one at a time (A B, B A, ...),
  #     each side as a pod in vllm-inference, writes results.json and
  #     results.md to the PVC image-compare-results, and keeps a short status
  #     in ConfigMap compare-<run id>;
  #   - the notebook compare_images.ipynb shows the results.
  # Any change below starts a new run (a new Job); a finished run is not run
  # again. One run at a time: a runner that finds another one still going
  # refuses to start and changes nothing (its Job reads Failed, exit 5), so
  # change this only after the current run has finished, or delete the running
  # Job first. A partial run's Job reads Failed; before you delete it, set
  # enabled to false or start a new run, or a later sync creates it again and
  # the run repeats. Setting enabled back to false deletes nothing.
  compare:
    enabled: false
    # pairs    - paired rounds of the two sides (described above).
    # scaleout - the scale-out benchmark (the commented example at the end of
    #            this block). It runs with scripts/compare-local.sh (docker)
    #            for now: the OpenShift Job refuses it (PLAN_INVALID) until
    #            its scale round is built.
    mode: pairs
    # Lower-case letters, digits, "-" or "."; at most 40 characters.
    runName: vllm-two-releases
    # Exactly two sides: A, the baseline, first; then B, the candidate. Every
    # ratio in the results is B/A. preset:
    #   vllm-openai    an upstream vLLM OpenAI server image (vllm serve)
    #   ray-serve-llm  this pattern's own server image, pinned by digest:
    #     image-registry.openshift-image-registry.svc:5000/vllm-inference/ray-serve-llm@sha256:<digest>
    #                  (oc get istag ray-serve-llm:latest -n vllm-inference
    #                  shows it). The run id comes from this config only, so
    #                  an image rebuilt under the same tag is not a new run.
    #   custom         set command and args yourself
    # args are added after the preset's own; env adds environment variables.
    # In both, {model_id}, {model_source}, {model_revision} and {port} are
    # filled in.
    sides:
      - name: vllm-0-32-0
        image: docker.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
        preset: vllm-openai
      - name: vllm-0-33-0
        image: docker.io/vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        preset: vllm-openai
    rounds:
      # Scored pairs. With the 4 default primary metrics and Holm's correction,
      # fewer than 8 pairs can never give FASTER or SLOWER (the plan warns).
      pairs: 10
      # One unscored round per side first: pulls the image, fills the model
      # cache.
      warmup: true
      # Extra pairs of side A against itself, to show the noise floor.
      aaPairs: 0
    server:
      gpuMemoryUtilization: 0.85
      maxModelLen: 8192
    load:
      # GuideLLM, one level after another in each round.
      concurrencies: [1, 8, 32]
      promptTokens: 256
      outputTokens: 128
      secondsPerLevel: 60
    analysis:
      # Declared before the run. TIE needs the median ratio and its whole
      # confidence interval within 1/(1+tieBand) and 1+tieBand; the interval
      # needs at least 6 usable pairs at ciLevel 0.95.
      tieBand: 0.05
      alpha: 0.05
      ciLevel: 0.95
      # Fewer usable pairs than this make a metric INCONCLUSIVE outright.
      minPairs: 3
      test: sign             # sign or wilcoxon
      correction: holm       # holm, bonferroni, bh or none
      # The primary metrics: only they share the correction, so only their
      # verdicts are findings; every other metric is reported with an
      # uncorrected p-value, as a description. null means the default: time to
      # first answer (startup.first_answer_s) and, at the highest concurrency,
      # c<N>.ttft_ms_median, c<N>.output_tokens_per_s and c<N>.tokens_per_joule.
      primary: null
    energy:
      # auto: DCGM (NVIDIA GPU Operator) through the cluster's monitoring;
      # none: no tokens per joule.
      source: auto
    # Mode scaleout, for scripts/compare-local.sh (its config file is JSON
    # with these keys, plus model). Each round starts one replica of the side,
    # then sends requests at a fixed rate (the surge) through a router that
    # picks the replica with the fewest requests in flight, and starts a
    # second replica of the same image stepAfterSeconds after the surge's
    # first request. The primary metrics are the new replica's time to first
    # answer and the share of the surge's requests within the latency goals;
    # with two primaries, 7 or more pairs are needed for FASTER or SLOWER.
    # Energy is not measured in this mode. compileCache: warm (docker only)
    # keeps a side's compile caches from its warm-up round for its scored
    # rounds; cold, the default, starts every replica with empty caches.
    #   mode: scaleout
    #   sides:
    #     - name: vllm-0-32-0
    #       image: docker.io/vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    #       preset: vllm-openai
    #       compileCache: cold
    #     - name: vllm-0-33-0
    #       image: docker.io/vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    #       preset: vllm-openai
    #       compileCache: cold
    #   rounds: {pairs: 8, warmup: true, aaPairs: 0}
    #   server:
    #     # Each replica's share of the GPU: with sharedGpu, two replicas
    #     # need it at most 0.475, so 0.85 above is refused in this mode.
    #     gpuMemoryUtilization: 0.4
    #     maxModelLen: 8192
    #   scaleOut:
    #     # Requests per second: pick a rate one replica cannot serve within
    #     # the goals, so the second replica has work to take.
    #     requestRate: 4
    #     surgeSeconds: 300
    #     stepAfterSeconds: 30
    #     ttftMs: 1000     # goal: time to first token, at most
    #     tpotMs: 100      # goal: inter-token latency, at most
    #     # Both replicas of a side on one GPU. false: each on a GPU of its
    #     # own, given with REPLICA_GPUS (scripts/compare-local.sh); a run
    #     # whose REPLICA_GPUS does not match this setting is refused.
    #     sharedGpu: true

main:
  variant: prod
  multiSourceConfig:
    enabled: true
    clusterGroupChartVersion: 0.9.*
