# Stubs for local rendering. At deploy time the Validated Patterns operator injects
# global.repoURL, global.targetRevision and global.localClusterDomain, and
# global.model comes from values-global.yaml.
global:
  repoURL: https://github.com/eugo-inc/vllm-ray-inference-server
  targetRevision: main
  localClusterDomain: apps.example.com
  clusterPlatform: AWS
  model:
    id: qwen2.5-0.5b-instruct
    revision: ""
  # global.compare comes from values-global.yaml; this stub keeps it off.
  compare:
    enabled: false

# CPU architecture (kubernetes.io/arch) of the node that builds and runs the image.
arch: amd64

image:
  # A prebuilt notebook image to run instead of building one in the cluster. When
  # set, the chart renders no BuildConfig, no ImageStream and no image trigger.
  override: ""
  pullPolicy: IfNotPresent

# In-cluster image build (BuildConfig notebook, Docker strategy). The image
# bakes in the notebooks/ folder at /opt/app-root/notebooks.
build:
  contextDir: notebooks
  dockerfilePath: Containerfile
  # Name of a Secret in vllm-notebook with git credentials, for a private fork.
  sourceSecret: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 10Gi
  completionDeadlineSeconds: 3600

notebook:
  # In-cluster Service of the inference server (no Route in between).
  endpoint: http://ray-serve-llm.vllm-inference.svc:8000
  serverNamespace: vllm-inference
  serverLabelSelector: app.kubernetes.io/name=ray-serve-llm
  # true sets RHVP_INTERNAL=1 (adds the amber INTERNAL strip).
  internal: false
  # Path to a recorded run inside the image; non-empty sets RHVP_REPLAY (REPLAY mode).
  replay: ""
  # Size of the writable /work folder the notebooks are copied into at start.
  workSizeLimit: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# The image comparison (global.compare in values-global.yaml). These settings are
# used only while global.compare.enabled is true.
compare:
  # The results PVC, in this namespace. ReadWriteOnce: the runner Job and the
  # notebook share it, so the Job's pod runs on the notebook pod's node.
  resultsSize: 5Gi
  storageClassName: ""
  # The longest a whole comparison may run before the Job is stopped (the run
  # then ends as partial, code RUN_TIMEOUT).
  activeDeadlineSeconds: 172800
  # How long the runner has to stop cleanly after SIGTERM (a deleted Job, or the
  # time limit above): it cuts the current launch short, deletes its side pod,
  # scales the pattern's server back and saves the results as partial.
  terminationGracePeriodSeconds: 300
  # The pattern's own server, in notebook.serverNamespace. The runner scales it
  # to 0 before the first launch and back to serverReplicas when the run ends,
  # however it ends. Empty serverDeployment leaves the server alone (then free
  # the GPU yourself).
  serverDeployment: ray-serve-llm
  serverReplicas: 1
  # The runner Job's pod (the GuideLLM image, with rhvp_compare copied in from
  # the notebook image). GuideLLM runs in it.
  runnerResources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      memory: 8Gi
  # Each side runs as a pod in the server namespace, like the pattern's own
  # server: keep these in step with charts/all/ray-serve-llm/values.yaml
  # (arch, server.resources, server.shmSizeLimit, server.cacheSizeLimit, gpu.*).
  side:
    # CPU type of the GPU node. Set arm64 here too when the server chart's arch
    # is arm64.
    arch: amd64
    resources:
      requests:
        cpu: "2"
        memory: 12Gi
      limits:
        memory: 24Gi
    shmSizeLimit: 4Gi
    cacheSizeLimit: 20Gi
    gpuResourceName: nvidia.com/gpu
    gpuTaintKey: nvidia.com/gpu
    modelsClaimName: ray-serve-llm-models
    llmConfigMap: ray-serve-llm-config
    hfSecretName: huggingface-secret
    hfSecretKey: hftoken
    # A side that has no node after this long fails its launch, with the
    # scheduler's message.
    pendingSeconds: 900

# OpenShift OAuth proxy in front of JupyterLab. Only users who may update the
# Service notebook in namespace vllm-notebook get in (namespace editors and
# admins, cluster admins).
oauthProxy:
  # The cluster's own oauth-proxy image: the ImageStream openshift/oauth-proxy,
  # tag v4.4, that every OpenShift 4 cluster carries (cluster-samples-operator,
  # manifests/08-openshift-imagestreams.yaml; the tag resolves to the oauth-proxy
  # image of the installed OpenShift release). It is pulled through the internal
  # image registry. Without that registry, use a Red Hat image instead, for example
  # registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.19
  image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Lets the imperative job ansible/rebuild-on-commit.yaml start builds in this
# namespace. The ServiceAccount is the clustergroup chart's default imperative one.
rebuildOnCommit:
  enabled: true
  serviceAccount:
    name: imperative-sa
    namespace: imperative
