# Cookie secret for the oauth-proxy. Generated once, when Argo CD first creates the
# Secret; the notebook application in variants/prod/values-prod.yaml ignores
# /data/session_secret, so later renders do not replace it.
apiVersion: v1
kind: Secret
metadata:
  name: rhvp-notebook-proxy
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
type: Opaque
data:
  session_secret: {{ randAlphaNum 32 | b64enc | quote }}
