# The oauth-proxy uses this ServiceAccount as its OAuth client; the annotation
# points the OAuth redirect at the Route rhvp-notebook. The notebook also uses its
# token to read server pod conditions (role-server-pods.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhvp-notebook
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"rhvp-notebook"}}'
