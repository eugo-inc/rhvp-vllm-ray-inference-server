apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: notebook
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
spec:
  host: notebook-{{ .Release.Namespace }}.{{ .Values.global.localClusterDomain }}
  to:
    kind: Service
    name: notebook
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
