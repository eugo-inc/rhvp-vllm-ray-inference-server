# Stubs for local rendering. At deploy time the Validated Patterns operator injects
# global.repoURL, global.targetRevision, global.localClusterDomain and
# global.clusterPlatform, and global.model comes from values-global.yaml.
global:
  repoURL: https://github.com/eugo-inc/vllm-ray-inference-server
  targetRevision: main
  localClusterDomain: apps.example.com
  clusterPlatform: AWS
  model:
    id: qwen2.5-0.5b-instruct
    source: Qwen/Qwen2.5-0.5B-Instruct
    revision: ""
  # global.scaleOut comes from values-global.yaml; this stub keeps it off.
  scaleOut:
    mode: none

# CPU architecture (kubernetes.io/arch) of the node that builds the image and of
# the GPU node that runs it. The default AWS GPU node (g6.2xlarge) is amd64.
arch: amd64

image:
  # A prebuilt server image to run instead of building one in the cluster, for
  # example on clusters whose internal image registry is Removed. When set, the
  # chart renders no BuildConfig, no ImageStream and no image trigger.
  override: ""
  pullPolicy: IfNotPresent

# In-cluster image build (BuildConfig ray-serve-llm, Docker strategy).
build:
  contextDir: inference-server
  dockerfilePath: Containerfile
  # Name of a Secret in vllm-inference with git credentials, for a private fork.
  sourceSecret: ""
  # The build unpacks a CUDA devel base image and installs several GB of wheels.
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
      ephemeral-storage: 50Gi
  completionDeadlineSeconds: 10800

# Rendered into ConfigMap ray-serve-llm-config, key llm.yaml.
server:
  appName: llm
  engineKwargs:
    max_model_len: 8192
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1
  acceleratorType: null
  # Inside the pod: Ray Serve's own autoscaler adds and removes vLLM replicas
  # in this one server pod. The defaults (1 and 1) keep one replica and no
  # autoscaling.
  autoscaling:
    minReplicas: 1
    maxReplicas: 1
    # Ongoing requests per replica that Ray Serve aims for. Required when
    # maxReplicas is above 1: Ray Serve LLM's own default target is 10^9, so
    # without it the replica count would never grow. null leaves it unset.
    targetOngoingRequests: null
  # GPUs each replica asks Ray for. maxReplicas * gpuPerReplica must not
  # exceed gpuCount. Below 1 (for example 0.5) replicas share one GPU, which
  # adds no GPU compute; that is for testing only.
  gpuPerReplica: 1
  # Ray's Prometheus metrics. The container port and the Service port are
  # both named "metrics".
  metricsPort: 8080
  objectStoreMemoryGb: 2
  httpHost: 0.0.0.0
  httpPort: 8000
  # GPUs for the pod; keep equal to engineKwargs.tensor_parallel_size.
  gpuCount: 1
  # Memory-backed /dev/shm for the Ray object store (objectStoreMemoryGb fits in it).
  # It counts against the memory limit below.
  shmSizeLimit: 4Gi
  # emptyDir for the Triton, vLLM, FlashInfer and XDG compile caches.
  cacheSizeLimit: 20Gi
  resources:
    requests:
      cpu: "2"
      memory: 12Gi
    limits:
      memory: 24Gi
  terminationGracePeriodSeconds: 120
  probes:
    # Startup and readiness check the ready file, which the server writes only
    # after the model is loaded and the app is RUNNING. The startup probe checks
    # every 2 s, and the kubelet runs the readiness probe as soon as the startup
    # probe passes, so the pod turns Ready up to about 2 s after the file appears;
    # the notebook's start-to-Ready figure cannot show differences smaller than
    # that. Startup budget: periodSeconds * failureThreshold = 2 * 1800 = 3600 s.
    # Readiness: the pod leaves the Service after about 2 * 15 = 30 s without the
    # file.
    startup:
      periodSeconds: 2
      failureThreshold: 1800
    readiness:
      periodSeconds: 2
      failureThreshold: 15
    liveness:
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5

gpu:
  resourceName: nvidia.com/gpu
  # Taint key on GPU nodes; the toleration uses operator Exists, so any value and
  # effect for this key is tolerated.
  taintKey: nvidia.com/gpu

# PVC for the Hugging Face cache (model weights), kept across pod restarts.
modelStorage:
  size: 50Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
  # ReadWriteOnce or ReadWriteMany. Server pods on more than one node
  # (global.scaleOut.mode: keda) need ReadWriteMany.
  accessMode: ReadWriteOnce

# Where the GPU compile caches (CUDA driver, FlashInfer, vLLM and Triton) live:
#   none    the pod's own emptyDir at /cache, emptied on every new pod
#   node    a folder on the node, kept for later pods on that node
#   shared  a volume that every server pod mounts
compileCache:
  mode: none

# Across pods: OpenShift's Custom Metrics Autoscaler (KEDA) adds and removes
# whole server pods. Used only while global.scaleOut.mode is keda
# (values-global.yaml); in every other mode none of this is rendered.
scaleOut:
  # Server pods, each with server.gpuCount GPUs.
  minPods: 1
  maxPods: 2
  # Waiting requests per pod (vLLM's gauge, exported by Ray as
  # ray_vllm_num_requests_waiting) above which a pod is added.
  waitingRequestsPerPod: 4
  pollingIntervalSeconds: 15
  cooldownSeconds: 300
  # The cluster monitoring's Thanos Querier.
  thanosUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local:9092

# Route to the OpenAI-compatible API. Off by default: the API has no
# authentication. The notebook talks to the Service, not to a Route.
route:
  enabled: false
  # The OpenShift router's default timeout is 30 s, too short for long completions.
  timeout: 10m

secretStore:
  name: vault-backend
  kind: ClusterSecretStore

# Hugging Face token: Vault path and property written by `make load-secrets`
# (values-secret.yaml.template, secret hfmodel, field hftoken).
hfmodel:
  key: secret/data/hub/hfmodel
  property: hftoken
  refreshInterval: 2m0s

# Lets the imperative job ansible/rebuild-on-commit.yaml start builds in this
# namespace. The ServiceAccount is the clustergroup chart's default imperative one.
rebuildOnCommit:
  enabled: true
  serviceAccount:
    name: imperative-sa
    namespace: imperative
