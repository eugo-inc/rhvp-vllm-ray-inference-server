apiVersion: v1
kind: Service
metadata:
  name: ray-serve-llm
  labels:
    {{- include "ray-serve-llm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ray-serve-llm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    {{- if eq (toString (.Values.global.scaleOut | default dict).mode) "keda" }}
    # Ray's Prometheus metrics, scraped through this port (servicemonitor.yaml).
    - name: metrics
      port: {{ .Values.server.metricsPort | int }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
