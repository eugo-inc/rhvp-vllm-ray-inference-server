apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ray-serve-llm-models
  labels:
    {{- include "ray-serve-llm.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.modelStorage.accessMode }}
  {{- with .Values.modelStorage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelStorage.size }}
