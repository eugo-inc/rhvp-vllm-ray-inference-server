# Hugging Face token from Vault. The server reads it as HF_TOKEN with optional: true,
# so the pod also starts while this Secret does not exist yet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: huggingface-secret
  labels:
    {{- include "ray-serve-llm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.hfmodel.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: huggingface-secret
  data:
    - secretKey: hftoken
      remoteRef:
        key: {{ .Values.hfmodel.key }}
        property: {{ .Values.hfmodel.property }}
