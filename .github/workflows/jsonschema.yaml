---
# Schema checks for the values files, the secrets template and the pattern metadata.
# scripts/validate-values.sh merges values-global.yaml, then variants/prod/values-prod.yaml,
# then each override file the cluster would include, and checks every merged tree
# against the clustergroup chart's values.schema.json. It also checks
# values-secret.yaml.template against the rhvp.cluster_utils secrets schema plus the
# secrets loader's non-empty rule.
name: Verify json schema

on: [push, pull_request]

permissions:
  contents: read

jobs:
  jsonschema:
    name: Values and secrets schema checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema pytest

      - name: Check merged values, secrets template and metadata
        run: scripts/validate-values.sh

      - name: Secrets template tests
        run: python -m pytest -q tests/test_secrets_template.py
